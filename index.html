    <meta name="theme-color" content="#0F0E0B">
    <script>
        // Tema prima del primo disegno (niente lampo): gymtracker_settings.theme = dark | light | auto
        (function () {
            var t = 'dark';
            try {
                var s = JSON.parse(localStorage.getItem('gymtracker_settings') || '{}');
                if (s && /^(dark|light|auto)$/.test(s.theme)) t = s.theme;
            } catch (e) { /* modalità privata o dato rotto: resta scuro */ }
            document.documentElement.setAttribute('data-theme', t);
            var light = t === 'light' || (t === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
            document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#F6F4EF' : '#0F0E0B');
        })();
    </script>

    <!-- Service Worker -->
    <script>
        (function () {
            const banner = document.getElementById('update-banner');
            document.getElementById('update-reload').addEventListener('click', () => location.reload());
            document.getElementById('update-dismiss').addEventListener('click', () => { banner.hidden = true; });
            if (!('serviceWorker' in navigator)) return;

            // Il banner ha senso solo se questa pagina era già servita da un SW: alla prima
            // visita il SW si installa e prende il controllo, ma non è un aggiornamento (G2).
            const hadController = !!navigator.serviceWorker.controller;
            const showUpdate = () => { if (hadController) banner.hidden = false; };

            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then((registration) => {
                        if (!registration) return;
                        const check = () => registration.update().catch(() => {});
                        setInterval(check, 30 * 60 * 1000);
                        document.addEventListener('visibilitychange', () => {
                            if (document.visibilityState === 'visible') check();
                        });
                        registration.addEventListener('updatefound', () => {
                            const worker = registration.installing;
                            if (!worker) return;
                            worker.addEventListener('statechange', () => {
                                if (worker.state === 'activated') showUpdate();
                            });
                        });
                    })
                    .catch((err) => console.error('SW non registrato:', err));

                navigator.serviceWorker.addEventListener('message', (event) => {
                    if (event.data && event.data.type === 'SW_UPDATED') showUpdate();
                });
            });
        })();
    </script>
